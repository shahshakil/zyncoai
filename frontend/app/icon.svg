<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Split-gradient vibe: Zapier orange -> n8n pink/purple -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4F00"/>
      <stop offset="55%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- soft shadow -->
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#g)"/>

  <!-- subtle inner highlight -->
  <path d="M20 24c10-10 50-10 60 0" stroke="#fff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>

  <!-- Z letter -->
  <text x="50" y="60" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Arial"
        font-size="52"
        font-weight="800"
        fill="#fff"
        filter="url(#s)">
    Z
  </text>
</svg>
