apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-ai-saas-services
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - my-ai-saas
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - api
          - webhooks
          - worker
          - billing
          - marketplace
          - agents
          - admin
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
