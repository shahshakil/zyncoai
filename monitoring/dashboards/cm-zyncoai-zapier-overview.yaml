apiVersion: v1
kind: ConfigMap
metadata:
  name: zyncoai-dashboard-zapier-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  zyncoai-zapier-overview.json: |
    {
      "id": null,
      "title": "ZyncoAI - Zapier Overview",
      "tags": ["zyncoai", "zapier"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Requests/sec (All Services)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_total[1m]))", "refId": "A" }]
        },
        {
          "type": "timeseries",
          "title": "5xx/sec (All Services)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m]))", "refId": "A" }]
        },
        {
          "type": "timeseries",
          "title": "p95 Latency (seconds)",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
            "refId": "A"
          }]
        }
      ]
    }
