apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozzle
  namespace: my-ai-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dozzle
  template:
    metadata:
      labels:
        app: dozzle
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: dozzle
          image: ghcr.io/amir20/dozzle:master
          ports:
            - containerPort: 8080
          env:
            - name: DOZZLE_LEVEL
              value: "info"
            - name: DOZZLE_MODE
              value: "kubernetes"
            - name: DOZZLE_KUBE_NAMESPACE
              value: "my-ai-saas"
            - name: DOZZLE_BASE
              value: "/"
---
apiVersion: v1
kind: Service
metadata:
  name: dozzle
  namespace: my-ai-saas
spec:
  selector:
    app: dozzle
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dozzle-ingress
  namespace: my-ai-saas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dozzle.zyncoai.com
      secretName: dozzle-tls
  rules:
    - host: dozzle.zyncoai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dozzle
                port:
                  number: 80
